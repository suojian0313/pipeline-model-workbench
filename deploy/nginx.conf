server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css application/wasm image/svg+xml;

    location /node-api/ {
        proxy_pass http://node:3001/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    location /python-api/ {
        proxy_pass http://python:3002/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    location /cesium/ {
        expires 1d;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
